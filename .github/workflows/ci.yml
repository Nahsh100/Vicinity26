name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: vicinity
          POSTGRES_PASSWORD: vicinity_dev_password
          POSTGRES_DB: vicinity_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U vicinity" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://vicinity:vicinity_dev_password@localhost:5433/vicinity_test
      TEST_DATABASE_URL: postgresql://vicinity:vicinity_dev_password@localhost:5433/vicinity_test
      JWT_ACCESS_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      STORAGE_SIGNING_SECRET: ci-only-storage-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vicinity/shared build
      - run: pnpm --filter @vicinity/api prisma:generate
      - name: Enable extensions in the test database
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @vicinity/api build
      - run: pnpm --filter @vicinity/admin build
      - run: pnpm --filter @vicinity/mobile build:web
